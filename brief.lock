# Locked brief — external SSD for MacBook Air M5

Locked: 2026-09-26
Region: United Kingdom
Quantity: 1
Budget: price under £200 (hard)

## Hard constraints

- External solid-state drive. A spinning hard drive does not qualify.
- Advertised capacity is 2TB or 4TB.
- USB-C connection that plugs into a MacBook Air M5 Thunderbolt 4 / USB4 port (cable in the box, or a USB-C port on the drive).
- Sold with delivery to the United Kingdom.
- Selling price under £200 GBP. A crossed-out higher price does not count.

## Exclusions

- Internal-only drives sold without an enclosure.
- Capacities other than 2TB and 4TB.
- Price of £200 or more.
- Listings that do not ship to the UK.

## Soft preferences

Ordered. These stay off the Shopper packet.

1. 4TB over 2TB.
2. Higher advertised sequential read, then higher advertised sequential write.

